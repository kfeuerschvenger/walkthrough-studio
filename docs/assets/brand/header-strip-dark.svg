    <linearGradient id="wt-fade" gradientUnits="userSpaceOnUse" x1="150" y1="0" x2="1260" y2="0">
      <stop offset="0" stop-color="#f99a1c" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#f99a1c" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f99a1c" stop-opacity="0.15"/>
