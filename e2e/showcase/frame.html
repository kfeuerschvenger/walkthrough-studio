<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Browser frame</title>
    <style>
      /*
       * The window a raw screenshot is placed in. The capture script loads this
       * page, calls window.placeShot(...) with the screenshot as a data URL, and
       * screenshots the .stage element. Nothing here reads the network.
       *
       * The colors are the brand's: the warm paper of the light banner, with
       * the orange of the mark and the near black of the app.
       */
      :root {
        --paper: #fcf8f1;
        --sand: #f6ead6;
        --orange: #f99a1c;
        --orange-deep: #c97608;
        --ink: #141414;
        --pad: 88px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: var(--sand);
      }

      .stage {
        position: relative;
        display: inline-block;
        padding: var(--pad);
        overflow: hidden;
        background:
          radial-gradient(1100px 700px at 12% 8%, rgb(255 255 255 / 0.9), transparent 60%),
          radial-gradient(900px 600px at 95% 100%, rgb(249 154 28 / 0.45), transparent 65%),
          linear-gradient(135deg, var(--paper) 0%, var(--sand) 50%, #f3d29b 100%);
      }

      /* A floor plan behind the window, the product's own subject. */
      .plan {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .window {
        position: relative;
        overflow: hidden;
        border-radius: 14px;
        background: var(--ink);
        box-shadow:
          0 0 0 1px rgb(20 20 20 / 0.12),
          0 2px 6px rgb(20 20 20 / 0.1),
          0 30px 60px -18px rgb(120 70 0 / 0.45),
          0 60px 120px -30px rgb(60 35 0 / 0.4);
      }

      .bar {
        display: flex;
        align-items: center;
        gap: 18px;
        height: 46px;
        padding: 0 18px;
        background: linear-gradient(#f7f3ec, #ece6da);
        border-bottom: 1px solid rgb(20 20 20 / 0.1);
      }

      .dots {
        display: flex;
        gap: 9px;
      }

      .dots i {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.12);
      }

      .dots i:nth-child(1) {
        background: #ff5f57;
      }

      .dots i:nth-child(2) {
        background: #febc2e;
      }

      .dots i:nth-child(3) {
        background: #28c840;
      }

      .title {
        flex: 1;
        display: flex;
        justify-content: center;
        /* The same width as the dots, so the title sits in the middle of the bar. */
        margin-right: 61px;
      }

      .title span {
        min-width: 280px;
        max-width: 520px;
        padding: 5px 16px;
        overflow: hidden;
        border-radius: 8px;
        background: rgb(20 20 20 / 0.06);
        color: #5c5448;
        font: 500 13px/1.3 'Segoe UI', system-ui, sans-serif;
        letter-spacing: 0.01em;
        text-align: center;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .window img {
        display: block;
        width: var(--shot-width, 1600px);
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <svg class="plan" viewBox="0 0 1000 700" preserveAspectRatio="none" aria-hidden="true">
        <g fill="none" stroke-linecap="square" stroke-linejoin="miter">
          <path d="M40 80H260V230H40Z M260 80H400V230H260Z M40 230H260V300H40Z" stroke="#c97608" stroke-width="2" opacity="0.22" />
          <path d="M760 520H960V640H760Z M860 520V640 M760 580H860" stroke="#c97608" stroke-width="2" opacity="0.2" />
          <path d="M700 40H960V160H700Z" stroke="#ffffff" stroke-width="3" opacity="0.6" />
        </g>
      </svg>
      <div class="window">
        <div class="bar">
          <div class="dots"><i></i><i></i><i></i></div>
          <div class="title"><span id="title">Walkthrough Studio</span></div>
        </div>
        <img id="shot" alt="" />
      </div>
    </div>
    <script>
      /**
       * Puts a screenshot in the window.
       *
       * @param {{ src: string, width: number, title?: string }} shot The image as a data URL, and the width in CSS pixels it was taken at.
       */
      window.placeShot = async ({ src, width, title }) => {
        document.documentElement.style.setProperty('--shot-width', `${width}px`);
        document.getElementById('title').textContent = title || 'Walkthrough Studio';

        const image = document.getElementById('shot');
        image.src = src;
        await image.decode();
      };

      /**
       * Measures how much a screenshot varies, to catch a blank or black canvas.
       *
       * @param {string} src The image as a data URL.
       * @returns {Promise<{ mean: number, deviation: number }>} Mean and standard deviation of the luminance, 0 to 255.
       */
      window.measureShot = async src => {
        const image = new Image();
        image.src = src;
        await image.decode();
        const canvas = document.createElement('canvas');
        canvas.width = 160;
        canvas.height = 100;
        const context = canvas.getContext('2d');
        context.drawImage(image, 0, 0, canvas.width, canvas.height);
        const { data } = context.getImageData(0, 0, canvas.width, canvas.height);
        let sum = 0;
        let sumOfSquares = 0;
        const count = data.length / 4;
        for (let index = 0; index < data.length; index += 4) {
          const luminance = 0.2126 * data[index] + 0.7152 * data[index + 1] + 0.0722 * data[index + 2];
          sum += luminance;
          sumOfSquares += luminance * luminance;
        }
        const mean = sum / count;
        return { mean, deviation: Math.sqrt(Math.max(0, sumOfSquares / count - mean * mean)) };
      };
    </script>
  </body>
</html>
